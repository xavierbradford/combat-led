; PlatformIO project for the MASTER ESP32 board.
; https://docs.platformio.org/en/latest/projectconf/index.html
;
; Build/flash from the repo root (no Arduino IDE needed):
;   python3 flash.py master
;
; Or from anywhere, once PlatformIO is installed:
;   pio run -d led_master_esp32 -t upload

[platformio]
; The .ino sketch lives in this folder, not in a src/ subdirectory.
src_dir = .

[env:master]
; pioarduino ships the ESP32 Arduino core 3.x (the sketches use the 3.x
; <NetworkUdp.h> API, which the upstream espressif32 platform does not
; bundle). 55.03.311 == Arduino core 3.3.11.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@6.21.6
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.11.2
    z3t0/IRremote@4.7.1
